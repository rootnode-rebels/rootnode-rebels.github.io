<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Street Not Found | RootNode Rebels Bakery & Café</title>
    
    <!-- Cache-Control Meta Tags -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Patrick+Hand&family=Shrikhand&display=swap" rel="stylesheet">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css?v=6.0">
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh; background-color:var(--butter-cream);">

    <!-- Tilt-Shift Macro Lens Optical Blurs (Top & Bottom) -->
    <div class="tilt-shift-blur-top"></div>
    <div class="tilt-shift-blur-bottom"></div>

    <!-- Navigation Bar -->
    <header class="top-bar-container">
        <nav class="signboard-navbar" style="max-width: 520px;">
            <a href="/" class="brand-sign">
                <div class="croissant-badge">🥐</div>
                <div class="brand-text">
                    <h1>RootNode Rebels</h1>
                    <p>Neighborhood Bakery & Café</p>
                </div>
            </a>
            <a href="/" class="sign-btn btn-open-door" style="text-decoration:none;">
                <span>←</span> Back to Café
            </a>
        </nav>
    </header>

    <!-- 404 Chalkboard Card -->
    <main style="z-index:10; max-width:540px; padding:48px 36px; background:var(--chalkboard-bg); border:10px solid var(--warm-brown); border-radius:24px; text-align:center; box-shadow:0 25px 60px rgba(69, 26, 3, 0.4); color:var(--chalk-white);">
        <div style="font-family:var(--font-hand); font-size:1.3rem; color:var(--butter-yellow); margin-bottom:8px;">
            ★ STREET SIGN 404 ★
        </div>
        <h1 style="font-family:var(--font-sign); font-size:clamp(4.5rem, 10vw, 7rem); font-weight:800; line-height:1; margin-bottom:12px; color:var(--butter-yellow);">
            404
        </h1>
        <h2 style="font-family:var(--font-sign); font-size:1.8rem; margin-bottom:14px; color:#ffffff;">You wandered past the cobblestones!</h2>
        <p style="font-family:var(--font-hand); color:#cbd5e1; font-size:1.2rem; line-height:1.6; margin-bottom:28px;">
            "Looks like the delivery bike turned down an uncharted alleyway. The bread is still warm back at the corner bakery, neighbor!"
        </p>
        <a href="/" class="btn-submit-catering" style="display:inline-block; text-decoration:none; max-width:280px; margin:0 auto; padding:12px 24px; font-size:1.15rem;">
            <span>Stroll Back to the Café 🥐</span>
        </a>
    </main>

</body>
</html>
