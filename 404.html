<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Node Disconnected | RootNode Rebels</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css?v=4.0">
</head>
<body>

    <!-- Ambient Cyan & Amber Refractive Accent Lights -->
    <div class="ambient-lights">
        <div class="ambient-light-cyan"></div>
        <div class="ambient-light-amber"></div>
    </div>
    <div class="noise-overlay"></div>

    <!-- Top Navigation Bar -->
    <header class="nav-container">
        <nav class="navbar" style="max-width: 600px;">
            <a href="/" class="logo">
                <div class="logo-prism"></div>
                <div class="logo-text">RootNode <span>Rebels</span></div>
            </a>
            <div class="nav-links">
                <a href="/" class="nav-item">Return to Root Node</a>
            </div>
        </nav>
    </header>

    <!-- 404 Frosted Glass Stage -->
    <main class="glass-viewport">
        <div class="glass-pane is-active" style="max-width: 620px; text-align: center; padding: 60px 40px;">
            <div class="pane-category amber" style="margin-bottom: 20px;">
                <span>⚠️</span> 404 // NETWORK EXCEPTION
            </div>
            <h1 class="accent-gradient" style="font-size: clamp(5rem, 12vw, 8rem); font-weight: 800; line-height: 1; margin-bottom: 12px;">
                404
            </h1>
            <h2 style="font-size: 1.8rem; margin-bottom: 16px; color: var(--text-primary);">Node Dimension Disconnected</h2>
            <p style="color: var(--text-secondary); font-size: 1.05rem; margin-bottom: 36px; line-height: 1.6;">
                The spatial coordinates you requested do not exist on our server cluster or have been rerouted to an encrypted node.
            </p>
            <a href="/" class="glass-btn btn-cyan" style="padding: 14px 34px;">
                <span>Return to Root Node</span>
                <span>↗</span>
            </a>
        </div>
    </main>

</body>
</html>
